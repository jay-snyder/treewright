name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create the GitHub release and upload artifacts

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser builds the changelog from git history, so it needs the
          # full history rather than a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Publishing the Homebrew cask pushes to a *different* repository
          # (jay-snyder/homebrew-tap), which the default GITHUB_TOKEN cannot do.
          # Until this secret exists, remove the homebrew_casks section from
          # .goreleaser.yaml or the release step will fail.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
