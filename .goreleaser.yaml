# GoReleaser builds every artifact a release needs from one tag push.
# Validate changes locally with: goreleaser check
version: 2

project_name: treewright

before:
  hooks:
    - go mod tidy

builds:
  - env:
      # No cgo, so each binary is fully static and runs on any machine of its
      # architecture without a matching libc.
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      # Stamps `treewright --version`. This is the authoritative spelling of a
      # release's version, but no longer the only source: an unstamped build —
      # `go install ...@latest`, which is how Linux installs without the cask —
      # falls back to the module version in the build info. See internal/cli/version.go.
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    # The other half of the prefixes CLAUDE.md asks non-user-facing work to
    # carry. A prefix means nothing until it is excluded here, and "^ci:" was
    # absent from this list from the initial commit: v0.1.0 published three of
    # them, and v0.4.0 would have published a linter pin to people reading for
    # what changed in the tool. Adding a prefix to the convention is half the
    # change; this list is the other half.
    exclude:
      - "^ci:"
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  footer: |
    ## Install

    ```sh
    brew install jay-snyder/tap/treewright
    ```

    Then add the shell integration to your shell's startup file:

    ```sh
    eval "$(treewright shell-init zsh)"     # or bash
    treewright shell-init fish | source
    ```

    And register a repository from inside it — tw is the installed short name,
    and everything answers to it:

    ```sh
    tw setup
    ```

# Publishes a Homebrew cask to a separate tap repository.
#
# A cask, not a formula: GoReleaser deprecated `brews`. Casks are macOS-only, so
# Linux installs come from `go install` or the tarballs above.
homebrew_casks:
  - repository:
      owner: jay-snyder
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: Jay Snyder
      email: github@catch.fail
    homepage: https://github.com/jay-snyder/treewright
    description: Give every ticket its own git worktree, tmux window, and agent session
    license: MIT
    binaries: [treewright]
    # Raw Ruby, for three stanzas GoReleaser cannot express.
    #
    # tw is the everyday name: a second link to the same binary, so it works
    # even before the shell integration (which also defines tw) is loaded.
    #
    # The quarantine flag. The released binaries are not code-signed, so macOS
    # kills a quarantined one at launch — exit 137, nothing printed — until the
    # flag the download arrived with is cleared. `hooks.post.install` did that
    # until Homebrew deprecated the `postflight` block it renders into, for
    # `postflight_steps`: declarative steps run in a sandbox rather than arbitrary
    # Ruby. GoReleaser passes a hook's body through untouched, so the hooks can
    # only emit the old stanza, and every brew command that loaded the cask
    # printed a warning asking users to report it to the tap. A deprecation in
    # Homebrew becomes an error a few releases on, and an error here is a cask
    # that does not load. `on_macos` stands in for the old `xattr -h` probe, the
    # cask carrying Linux URLs too. `{{ "{{staged_path}}" }}` is Homebrew's token
    # behind GoReleaser's: custom_block is templated exactly once, so the outer
    # braces are spent here and `{{staged_path}}` is what reaches the cask. And
    # the step must succeed, where the old hook ignored a failure: an upgrade
    # that stops on xattr's error leaves the working version in place, and one
    # that carries on installs a binary that dies without a word. A brew older
    # than 6.0.13, which added the `run` step, cannot load the cask at all, and
    # `brew upgrade` updates brew first unless told not to. Verified against
    # Homebrew 7.0.8.
    #
    # And the caveats, which brew prints on an upgrade exactly as it prints them
    # on an install — so a fixed string spends the one moment an upgrader is
    # reading on the steps they took months ago, and says nothing about the
    # worktrees, the tmux server and the shell that are still running the
    # version they just replaced. GoReleaser's `caveats:` key renders as a
    # heredoc and cannot ask which is happening; the block form can.
    #
    # `installed_version` reads the Caskroom while the cask is being loaded, so
    # it is nil on a first install and the version being replaced on an upgrade.
    # Equal to the version arriving means neither — `brew info`, or a reinstall —
    # and those get the install text, since somebody who is not moving between
    # versions has nothing to refresh.
    #
    # The version arriving is spelled as GoReleaser's own `{{ .Version }}`,
    # interpolated into the Ruby here, and deliberately not as the cask's
    # `version` stanza. GoReleaser emits custom_block at the *top* of the cask, a
    # cask body is instance_eval'd top to bottom, and `caveats` evaluates its
    # block immediately rather than at print time (`cask/dsl/caveats.rb`) — so
    # `version` is still nil this early, and comparing against it silently never
    # matches. That failure is invisible in review and quiet in use: the text is
    # only wrong on the two cases nobody tests, so `brew info` on an installed
    # cask reads as an upgrade. Reaching for `version` here is the natural
    # tidy-up; it is the bug. Verified against Homebrew 6.0.15.
    custom_block: |
      binary "treewright", target: "tw"

      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/treewright"]
        end
      end

      caveats do
        replacing = cask.installed_version
        if replacing.nil? || replacing.to_s == "{{ .Version }}"
          <<~FIRST_INSTALL
            Add the shell integration to your shell's startup file:
              eval "$(treewright shell-init zsh)"     # or bash
              treewright shell-init fish | source

            Then register a repository by running "tw setup" inside it.
            (tw is the installed short name; every command answers to it.)
          FIRST_INSTALL
        else
          <<~AFTER_UPGRADE
            The new binary is in place. Nothing that loaded the old one knows yet,
            so from a repository you use treewright in:

              tw refresh

            That rewrites every copy of the agent plugin — the user-level one, and
            any a worktree was given when it was created, which nothing has looked
            at since — and reloads the tmux key bindings into the server you are
            attached to, and the shell wrapper in the terminal you run it in.

            Any other terminal keeps the old wrapper until it restarts, so open
            new ones as well. "tw doctor" says whether anything is still behind.
          AFTER_UPGRADE
        end
      end
    dependencies:
      - formula: git
      - formula: tmux
    # No `hooks:` key — the quarantine step is `postflight_steps` in custom_block
    # above, since a hook renders into the `postflight` block Homebrew deprecated.
    # No `caveats:` key — the cask's caveats are the block in custom_block
    # above. The two would both be printed: a cask accumulates every caveats
    # stanza it is given rather than the last one winning.
